<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 318" width="1100" height="318" role="img" aria-labelledby="t d">
<title id="t">Measures on and around the cortical surface</title>
<desc id="d">Schematic cortical ribbon with the skull, pial, central and white matter surfaces; cortical measures (gray matter thickness, area and volume, CSF and white matter volume); intensity- and projection-based measures sampled from fMRI, structural and diffusion MRI, including a white matter lesion; and folding measures (curvature as one over the local radius of gyri and sulci, sulcal depth to the convex hull, and the area relation of the folded and the unfolded surface).</desc>
