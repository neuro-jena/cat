svg { --text:#17202b; --muted:#556170; --band:rgba(23,32,43,.045); --gm:#d5dce4; --gmvol:#9aa6b2; --skull:#8b96a3; --csf-fill:rgba(42,120,214,.15); --lesion-fill:#dccfa9; --pial:#0b64a0; --pial-line:#1899dc; --central:#8f5400; --central-line:#e08a00; --white:#1f7028; --white-line:#2ea836; --thick:#5a3fd0; --area:#b23a0a; --csf:#1f63b0; --fmri:#b02a62; --smri:#1f63b0; --lesion:#7a6331; --dmri:#097052; --gyri:#c42f2f; --sulci:#1f63b0; --depth:#096a7c; --arearel:#25702f; }
@media (prefers-color-scheme: dark) { svg { --text:#e6ebf0; --muted:#9aa6b2; --band:rgba(230,235,240,.05); --gm:#3a4552; --gmvol:#6a7684; --skull:#6f7b88; --csf-fill:rgba(121,184,255,.17); --lesion-fill:#7d7158; --pial:#4cc3ff; --pial-line:#4cc3ff; --central:#ffb43c; --central-line:#ffb43c; --white:#5fe356; --white-line:#5fe356; --thick:#a99bff; --area:#ff8a5c; --csf:#79b8ff; --fmri:#ff8fbf; --smri:#79b8ff; --lesion:#cbb98d; --dmri:#3ddc9f; --gyri:#ff7b7a; --sulci:#79b8ff; --depth:#3fd0e0; --arearel:#69db7c; } }
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--text); }
.h { font-size: 15px; font-weight: 650; }
.n { font-size: 12.5px; }
.s { font-size: 11.5px; }
</style>
